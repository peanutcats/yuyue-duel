<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">羽跃对决 · 微信小游戏图标</title>
  <desc id="desc">深蓝色背景上，一只白色羽毛球向前飞出，后方交叉着金色羽毛球拍，下方环绕红金色扣杀轨迹。</desc>
  <defs>
    <radialGradient id="background" cx=".59" cy=".34" r=".83">
      <stop stop-color="#243E79"/>
      <stop offset=".53" stop-color="#111D42"/>
      <stop offset="1" stop-color="#070C21"/>
    </radialGradient>
    <linearGradient id="beam" x1="910" y1="70" x2="230" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BACFF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#7BACFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="-130" y1="-170" x2="130" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3AF"/>
      <stop offset=".32" stop-color="#FFDC62"/>
      <stop offset=".68" stop-color="#F4AA36"/>
      <stop offset="1" stop-color="#BD641D"/>
    </linearGradient>
    <linearGradient id="shaft" x1="-12" y1="230" x2="12" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0A1"/>
      <stop offset=".5" stop-color="#EDBC50"/>
      <stop offset="1" stop-color="#C17B28"/>
    </linearGradient>
    <linearGradient id="grip" x1="-23" y1="377" x2="25" y2="495" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7472"/>
      <stop offset=".48" stop-color="#F34051"/>
      <stop offset="1" stop-color="#AB1F3E"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="235" y1="843" x2="824" y2="550" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D57327"/>
      <stop offset=".42" stop-color="#FFBD38"/>
      <stop offset=".78" stop-color="#FFE580"/>
      <stop offset="1" stop-color="#FFF5B7"/>
    </linearGradient>
    <linearGradient id="feather" x1="-170" y1="-258" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".46" stop-color="#F4FCFF"/>
      <stop offset="1" stop-color="#A5C7DD"/>
    </linearGradient>
    <linearGradient id="centerFeather" x1="-20" y1="-306" x2="40" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".67" stop-color="#F2FAFC"/>
      <stop offset="1" stop-color="#C3DFEA"/>
    </linearGradient>
    <linearGradient id="collar" x1="-80" y1="83" x2="80" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8D7D"/>
      <stop offset=".3" stop-color="#FF5261"/>
      <stop offset="1" stop-color="#BF2646"/>
    </linearGradient>
    <linearGradient id="cork" x1="-58" y1="132" x2="60" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#FFF7DE"/>
      <stop offset="1" stop-color="#D9B575"/>
    </linearGradient>
    <clipPath id="stringsClip">
      <ellipse rx="124" ry="163"/>
    </clipPath>
    <pattern id="strings" width="29" height="29" patternUnits="userSpaceOnUse">
      <path d="M29 0H0V29" stroke="#B4D3E8" stroke-opacity=".48" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- Full-bleed square: the platform supplies its own corner mask. -->
  <path fill="url(#background)" d="M0 0h1024v1024H0z"/>
  <path d="M629 0h229L175 916H0z" fill="url(#beam)"/>
  <path d="M968 0h56v167L384 1024H212z" fill="url(#beam)" opacity=".52"/>
  <path d="M109 520 233 364M139 614l60-77M741 147l45-57" stroke="#81B9FF" stroke-opacity=".16" stroke-width="7" stroke-linecap="round"/>

  <!-- The oval racket and sparse strings stay distinct at small sizes. -->
  <g transform="translate(350 370) rotate(-38)">
    <path d="M-63 160-11 257h22l52-97" stroke="#06112C" stroke-width="31" stroke-linejoin="round"/>
    <path d="M-63 160-11 249h22l52-89" stroke="url(#gold)" stroke-width="17" stroke-linejoin="round"/>
    <path d="M0 241v169" stroke="#08122C" stroke-width="30"/>
    <path d="M0 241v169" stroke="url(#shaft)" stroke-width="15"/>
    <path d="M-4 257v120" stroke="#FFF3B8" stroke-opacity=".7" stroke-width="4"/>
    <rect x="-27" y="381" width="54" height="126" rx="17" fill="#07112B"/>
    <rect x="-21" y="383" width="42" height="117" rx="12" fill="url(#grip)"/>
    <path d="m-19 402 38 14m-38 8 38 14m-38 8 38 14m-38 8 38 14" stroke="#8C1534" stroke-width="5"/>
    <path d="M-14 391v93" stroke="#FFB2A1" stroke-opacity=".54" stroke-width="4" stroke-linecap="round"/>
    <rect x="-26" y="492" width="52" height="15" rx="6" fill="#FFD35C"/>
    <ellipse cy="7" rx="147" ry="190" fill="#07122A"/>
    <ellipse rx="137" ry="180" fill="#101E3C" stroke="url(#gold)" stroke-width="24"/>
    <g clip-path="url(#stringsClip)">
      <path d="M-130-170h260v340h-260z" fill="url(#strings)"/>
    </g>
    <ellipse rx="123" ry="165" stroke="#FFF0A2" stroke-opacity=".65" stroke-width="3"/>
    <path d="M-127 48C-149-37-113-137-47-166" stroke="#FFF6CC" stroke-width="7" stroke-linecap="round"/>
    <path d="M93-128c41 47 59 108 43 171" stroke="#C57A27" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- One broad motion arc, with a red underside and a tapered gold face. -->
  <path d="M164 631c-12 161 143 252 327 222 164-27 283-129 362-274-56 168-184 294-360 325C268 943 104 825 164 631Z" fill="#EC4050"/>
  <path d="M174 622c-11 136 137 211 299 188 171-24 299-117 383-255-65 169-207 281-387 309C274 894 129 793 174 622Z" fill="url(#swoosh)"/>
  <path d="M224 760c105 96 351 43 488-70" stroke="#FFF0A0" stroke-opacity=".73" stroke-width="5" stroke-linecap="round"/>

  <!-- Feather cone: overlapping broad blades, rather than tiny texture. -->
  <g transform="translate(583 465) rotate(34)">
    <path d="M-77 103c-38-70-94-180-141-327-8-27 6-48 30-46 14-25 34-33 56-20 15-25 37-29 58-13 17-24 45-25 64-7 21-17 47-11 59 8 26-10 48-1 58 21 26-4 45 12 48 35 28 6 38 30 26 55L76 103Z" transform="translate(10 15)" fill="#030C23" fill-opacity=".5"/>
    <path d="M-71 100c-48-82-101-203-141-328-9-30 6-49 28-43 26 8 56 91 83 174l64 188Z" fill="url(#feather)" stroke="#B3D0E1" stroke-width="3"/>
    <path d="M-52 96c-44-97-90-224-115-340-7-31 5-51 26-47 26 5 46 78 64 156L-21 91Z" fill="url(#feather)" stroke="#B9D7E6" stroke-width="3"/>
    <path d="M-29 93c-28-96-54-235-63-354-2-31 11-49 31-43 24 7 31 74 38 143L9 91Z" fill="url(#centerFeather)" stroke="#BFDCE8" stroke-width="3"/>
    <path d="M-6 94c-13-106-19-251-13-367 2-29 18-43 36-33 22 12 20 77 21 142L30 96Z" fill="url(#centerFeather)" stroke="#C2DFEA" stroke-width="3"/>
    <path d="M19 96c3-104 20-247 45-354 7-30 25-41 41-26 17 15 7 76-6 136L48 100Z" fill="url(#centerFeather)" stroke="#BFDCE8" stroke-width="3"/>
    <path d="M43 99c20-95 55-223 92-320 11-29 31-35 44-17 15 20-5 72-26 126L67 107Z" fill="url(#feather)" stroke="#B5D4E4" stroke-width="3"/>
    <path d="M63 105c37-81 83-186 126-266 14-27 34-28 43-8 10 22-14 64-37 105L78 116Z" fill="url(#feather)" stroke="#B0CFDF" stroke-width="3"/>

    <g stroke="#86AFC9" stroke-opacity=".46" stroke-width="4" stroke-linecap="round">
      <path d="M-187-244-56 72M-143-261-36 77M-67-277-13 79M7-281l8 363M89-258 39 86M158-215 60 92M210-158 76 98"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity=".7" stroke-width="4" stroke-linecap="round">
      <path d="m-163-185 29 27m-15 15 30 23m-20-72 31 25m39-72 24 25m-23 15 26 23M9-239l-17 24m18 14-17 23m91-40-24 19m19 9-23 20m91-4-28 14m16 12-26 12m84-21-25 8"/>
    </g>

    <!-- Binding band and rounded cork give a clear badminton silhouette. -->
    <path d="M-75 81q76-19 151 11l-3 43q-73 22-145-7Z" fill="url(#collar)"/>
    <path d="M-72 88q72-14 142 10" stroke="#FFB5A0" stroke-width="6" stroke-linecap="round"/>
    <path d="M-71 124q71 23 143 9l-4 35c-4 39-30 66-69 65-39-1-66-28-70-66Z" fill="url(#cork)"/>
    <path d="M-71 124q71 23 143 9" stroke="#8D1835" stroke-width="8"/>
    <path d="M-53 151c-1 28 10 48 30 59" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="10" stroke-linecap="round"/>
    <path d="M30 218c19-8 30-24 32-43" stroke="#BA9359" stroke-opacity=".4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- A few large sparks support the motion without clutter. -->
  <path d="m278 635-35 28M310 671l-17 29M746 694l34-28" stroke="#FFE38A" stroke-width="10" stroke-linecap="round"/>
  <path d="m818 479 9 19 21 4-18 12-3 22-14-17-21 4 12-18-8-20Z" fill="#FFE17A"/>
</svg>
