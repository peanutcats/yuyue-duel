<div id="stage"><header><div class="label">YUYUE / CHARACTER ATELIER</div><h1>角色检视台</h1><p>20 位球友 · 每个人的表情与招牌姿态。切换 2D / 3D，逐帧检查挥拍与步法。</p><nav><select id="castFilter" aria-label="球友范围"><option value="all">全部球友</option><option value="club">三位新球友</option></select><button data-mode="art" class="on">角色立绘</button><button data-mode="3d">3D 模型</button><button data-mode="2d">2D 角色</button><select id="action" aria-label="动作"><option value="ready">准备姿态</option><option value="run">移动步法</option><option value="smash">跳杀</option><option value="clear">高远</option><option value="lift">低位救球</option><option value="flatclear">平高球</option><option value="drop">吊球</option><option value="slice">劈吊</option><option value="halfsmash">点杀</option><option value="drive">平抽</option><option value="push">推球</option><option value="kill">扑杀</option><option value="net">搓网</option><option value="tumble">滚网</option><option value="block">挡网</option><option value="lserve">长发球</option><option value="sserve">短发球</option><option value="skill">角色技能</option></select><select id="angle" aria-label="视角"><option value="0">正面</option><option value="3.14159265">背面</option><option value="1.047">侧面</option></select><select id="side" aria-label="角色位置"><option value="0">己方角色</option><option value="1">对方角色</option></select><select id="hand" aria-label="击球方向"><option value=".28">正手</option><option value="-.45">反手</option></select><select id="move" aria-label="步法方向"><option value="0">向前移动</option><option value="3.14159265">向后移动</option><option value="1.5707963">向右并步</option><option value="-1.5707963">向左并步</option><option value=".785398">斜向移动</option></select><select id="grade" aria-label="击球质量"><option value=".65">正常击球</option><option value=".2">勉强击球</option><option value=".95">完美击球</option></select><select id="skillSlot" aria-label="主动技能序号"><option value="0">主动技能一</option><option value="1">主动技能二</option><option value="2">主动技能三</option></select><select id="stamina" aria-label="体力"><option value="100">体力充沛</option><option value="45">体力偏低</option><option value="15">疲劳状态</option></select><select id="speed" aria-label="播放速度"><option value="1">原速</option><option value=".35">慢动作</option></select><button id="pause">暂停</button><input id="timeline" type="range" min="0" max="1" step=".005" value="0" aria-label="动作进度"></nav></header><main id="gallery"></main></div>

<script src="../js/achievements.js"></script><script src="../js/roster.js"></script><script src="../js/character-art.js"></script><script src="../js/match.js"></script><script src="../js/court3d.js"></script><script src="../js/char.js?v=motion-fluid-20261111"></script><script src="../js/venues.js"></script><script src="../js/render.js"></script><script src="../js/court3d-motion.js?v=motion-fluid-20261111"></script><script src="../js/court3d-render.js"></script><script src="../js/character-model3d.js?v=motion-fluid-20261111"></script>
<script>
let mode='art',stopped=false,time=0;const cards=[],act=document.querySelector('#action'),angle=document.querySelector('#angle'),slider=document.querySelector('#timeline'),side=document.querySelector('#side'),hand=document.querySelector('#hand'),move=document.querySelector('#move'),speed=document.querySelector('#speed'),grade=document.querySelector('#grade'),skillSlot=document.querySelector('#skillSlot'),stamina=document.querySelector('#stamina');
for(const [i,c]of YY.CHARS.entries()){
 const root=document.createElement('article');root.className='card';root.innerHTML=`<header><b>${YY.charName(c.id)}</b><small>${String(i+1).padStart(2,'0')} / YUYUE</small></header><canvas width="560" height="580"></canvas><footer>${c.title}</footer>`;document.querySelector('#gallery').append(root);
 const canvas=root.querySelector('canvas'),g=canvas.getContext('2d'),m=new YY.Match3D({skills:[YY.skillSet(c.id),null]});m.looks=[YY.lookOf(c.id),YY.lookOf(c.id)];const r={W:280,H:290,quality:1,time:0,mirror:false,lookOf:(m,i)=>m.looks[i]},v=new YY.CourtView3D(r);
 v.project=(x,y=0,z=0)=>{const a=+angle.value,X=x*Math.cos(a)-z*Math.sin(a),Z=x*Math.sin(a)+z*Math.cos(a);return{x:140+Z*73+X*14,y:255-y*102-X*11,k:100,d:20+X};};cards.push({g,m,v,c});
}
function draw(){for(const {g,m,v,c}of cards){const p=m.players[+side.value],type=act.value,u=+slider.value,cycle=type==='skill'?.62:type==='smash'?.48:.34,tt=u*cycle;
 const jumping=type==='smash',height=jumping?2.6*u*(1-u):0,moving=type==='run';
 Object.assign(p,{x:0,z:0,y:height,vy:jumping?2.6/cycle*(1-2*u):0,onGround:!jumping||u===0||u===1,vx:moving?p.dir*Math.cos(+move.value)*3.6:0,vz:moving?p.dir*Math.sin(+move.value)*3.6:0,runPhase:time*9.36,stamina:+stamina.value,motion:{speed:moving?Math.cos(+move.value)*3.6:0,accel:0,air:tt,land:0,split:0},swing:['ready','run','skill'].includes(type)?null:{q:+grade.value,t:tt,dur:cycle,style:type,kind:YY.MOTION_CLIPS[type]?.family==='over'?'over':'under',btn:type==='smash'?'smash':'clear',hit:tt>=.11,contact:{x:p.dir*.54,y:jumping?2.5:['lift','net','tumble','sserve','block'].includes(type)?.95:['drive','push'].includes(type)?1.55:2.1,z:p.dir*+hand.value,t:.11}}});
 m.time=time;m.shuttle.live=false;v.time=time;v.r.time=time;v.r.modelAngle=+angle.value;v.r.characterCasts=[];if(type==='skill')v.r.characterCasts[p.idx]={id:c.acts[+skillSlot.value],start:time-tt};
 g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,280,290);g.fillStyle='#7acbb120';g.beginPath();g.ellipse(140,260,88,16,0,0,Math.PI*2);g.fill();g.strokeStyle='#b7d6d120';g.lineWidth=1;g.beginPath();g.moveTo(26,260);g.lineTo(254,260);g.stroke();
 if(mode==='art'){v.keyart=v.keyart||YY.characterIllustration(m.looks[p.idx],560,580);g.drawImage(v.keyart,0,0,280,290);}else if(mode==='3d')v.player(g,p,m);else{g.save();g.translate(133,256-p.y*96);g.scale(p.dir*108,-108);YY.drawCharacter(g,p,m.looks[p.idx],{time,quality:1,mood:'play',action:type==='skill'?YY.CharacterArt?.action(c.acts[+skillSlot.value],tt):null});g.restore();}
}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(el=>el.classList.toggle('on',el===b));draw();});document.querySelector('#pause').onclick=()=>{stopped=!stopped;document.querySelector('#pause').textContent=stopped?'播放':'暂停';};slider.oninput=()=>{stopped=true;document.querySelector('#pause').textContent='播放';draw();};for(const field of[act,angle,side,hand,move,grade,skillSlot,stamina])field.onchange=()=>{cards.forEach(c=>c.v.racketTrails=[[],[]]);draw();};let last=0;function tick(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;if(!stopped){time+=dt*+speed.value;const duration=act.value==='skill'?.62:act.value==='smash'?.48:.34;slider.value=Math.min(1,(time%(duration+.4))/duration);}draw();requestAnimationFrame(tick);}requestAnimationFrame(tick);
const castFilter=document.querySelector('#castFilter');
function filterCast(){document.querySelectorAll('.card').forEach((el,i)=>{el.hidden=castFilter.value==='club'&&!['zhuzhu','sun','dong'].includes(YY.CHARS[i].id);el.style.display=el.hidden?'none':'';});document.querySelector('#gallery').style.gridTemplateColumns=castFilter.value==='club'?'repeat(3,minmax(0,1fr))':'';}
castFilter.onchange=filterCast;if(new URLSearchParams(location.search).get('cast')==='club'){castFilter.value='club';filterCast();}
window.CharacterLab={cards,draw,setTime:t=>{stopped=true;time=t;slider.value=.22;draw();}};
</script></html>
